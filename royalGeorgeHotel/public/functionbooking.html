<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Function Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <!-- Booking Modal -->
  <div class="bg-[#2e2e38] text-white w-full max-w-4xl rounded-md shadow-lg p-8 relative">

    <!-- Header -->
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold uppercase">Function Booking</h2>
    </div>

    <!-- Form -->
    <form class="space-y-6">
      
      <!-- Row 1: Name -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" placeholder="First Name" class="w-full px-4 py-2 bg-transparent border border-gray-500 rounded placeholder-gray-300 focus:outline-none text-white" />
        <input type="text" placeholder="Last Name" class="w-full px-4 py-2 bg-transparent border border-gray-500 rounded placeholder-gray-300 focus:outline-none text-white" />
      </div>

      <!-- Row 2: Contact -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="tel" placeholder="Phone Number" class="w-full px-4 py-2 bg-transparent border border-gray-500 rounded placeholder-gray-300 focus:outline-none text-white" />
        <input type="email" placeholder="Email" class="w-full px-4 py-2 bg-transparent border border-gray-500 rounded placeholder-gray-300 focus:outline-none text-white" />
      </div>

      <!-- Row 3: Date and Time -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="date" class="w-full px-4 py-2 bg-transparent border border-gray-500 rounded text-gray-300 focus:outline-none" />
        <input type="time" class="w-full px-4 py-2 bg-transparent border border-gray-500 rounded text-gray-300 focus:outline-none" />
      </div>

      <!-- Row 4: Message and Area -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" placeholder="Message" class="w-full px-4 py-2 bg-transparent border border-gray-500 rounded placeholder-gray-300 focus:outline-none text-white" />
        <input type="text" placeholder="Preferred Area" class="w-full px-4 py-2 bg-transparent border border-gray-500 rounded placeholder-gray-300 focus:outline-none text-white" />
      </div>

      <!-- Consent Checkbox -->
      <div class="flex items-start space-x-2 text-xs text-gray-300">
        <input type="checkbox" id="consent" class="mt-1" />
        <label for="consent">I Do Not Consent To Join The Royal George Hotel Marketing And Email List.</label>
      </div>

      <!-- Submit Button -->
      <div class="text-center">
        <button type="submit" class="px-8 py-2 bg-white text-black rounded shadow hover:bg-gray-200 transition">Submit</button>
      </div>
    </form>
  </div>
</body>
</html>
